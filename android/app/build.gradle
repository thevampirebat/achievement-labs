plugins { id 'com.android.application' }
android {
 namespace 'org.achievementlabs.mobile'
 compileSdk 35
 defaultConfig { applicationId 'org.achievementlabs.mobile'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildFeatures { buildConfig true }
 lint { abortOnError true; disable 'OldTargetApi','GradleDependency','ObsoleteSdkInt','SetJavaScriptEnabled','JavascriptInterface','Deprecated','UnusedResources','MissingTranslation' }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'com.google.zxing:core:3.5.3'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}
