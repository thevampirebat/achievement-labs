name: Android standalone beta
on:
  pull_request:
    branches: [main]
    paths: [android/**, mobile/tools/prepare_catalogue.py, Events/**, .github/workflows/android-build.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LABS_CATALOGUE: ${{ github.workspace }}/mobile/Catalogue
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare the shared deterministic mobile catalogue and Android icon
        run: |
          python3 mobile/tools/prepare_catalogue.py
          cp -R mobile/Catalogue android/app/src/main/assets/catalogue
          mkdir -p android/app/src/main/res/drawable
          cp src/AchievementLabs.App/Assets/achievement-labs-icon.png android/app/src/main/res/drawable/app_icon.png
      - name: Check JavaScript and build the signed test APK
        run: |
          node --check android/app/src/main/assets/app.js
          gradle -p android testDebugUnitTest assembleDebug lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify standalone launch and offline screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 android/smoke.py
      - name: Package APK and checksums
        run: |
          mkdir -p android/artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android/artifacts/AchievementLabs-Android-0.1.0.apk
          cp android/README.md android/artifacts/
          sha256sum android/artifacts/AchievementLabs-Android-0.1.0.apk > android/artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AchievementLabs-Android-Beta
          path: android/artifacts/
          retention-days: 30
          if-no-files-found: error
