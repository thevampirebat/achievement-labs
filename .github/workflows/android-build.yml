name: One-time Android signing-secret transfer
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: GitHub public encryption key for Achievement-Labs/achievement-labs
        required: true
        type: string
      key_id:
        description: ID of that public encryption key
        required: true
        type: string
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install GitHub-compatible secret encryption
        run: python -m pip install --quiet PyNaCl
      - name: Encrypt existing signing secrets for the official repository
        env:
          TARGET_PUBLIC_KEY: ${{ inputs.public_key }}
          TARGET_KEY_ID: ${{ inputs.key_id }}
          LABS_ANDROID_KEYSTORE_BASE64: ${{ secrets.LABS_ANDROID_KEYSTORE_BASE64 }}
          LABS_ANDROID_KEY_ALIAS: ${{ secrets.LABS_ANDROID_KEY_ALIAS }}
          LABS_ANDROID_STORE_PASSWORD: ${{ secrets.LABS_ANDROID_STORE_PASSWORD }}
          LABS_ANDROID_KEY_PASSWORD: ${{ secrets.LABS_ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import os,json,base64
          from nacl.public import PublicKey,SealedBox
          box=SealedBox(PublicKey(base64.b64decode(os.environ['TARGET_PUBLIC_KEY'],validate=True)))
          names=['LABS_ANDROID_KEYSTORE_BASE64','LABS_ANDROID_KEY_ALIAS','LABS_ANDROID_STORE_PASSWORD','LABS_ANDROID_KEY_PASSWORD']
          encrypted=[]
          for name in names:
              value=os.environ.get(name,'')
              if not value: raise SystemExit('The source repository is missing '+name)
              encrypted.append({'name':name,'key_id':os.environ['TARGET_KEY_ID'],'encrypted_value':base64.b64encode(box.encrypt(value.encode())).decode()})
          with open('encrypted-signing-secrets.json','w') as f: json.dump(encrypted,f)
          print('Encrypted four existing secrets for the destination GitHub public key. No plaintext exported.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-transfer-${{ github.run_id }}
          path: encrypted-signing-secrets.json
          if-no-files-found: error
          retention-days: 1
