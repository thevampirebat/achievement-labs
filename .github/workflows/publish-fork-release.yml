name: Publish fork release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-fork-release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-v1.0.8-fork.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.8-fork.1
      SOURCE_SHA: 5ab5da116d04f58a68e38cfb5e5e66b50c635718
      BUILD_SHA: d1a19ce943cd12f34ff23c2c5ea208d38bdf0d74
      BUILD_RUN: '38825948623'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested source
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$BUILD_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$(git rev-parse "$BUILD_SHA^{tree}")"
      - uses: actions/download-artifact@v4
        with:
          name: AchievementLabs-Windows-x64
          path: release-download
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Verify download and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          folder = Path('release-download')
          expected = (folder / 'SHA256.txt').read_text(encoding='utf-8-sig').split()[0].lower()
          exe = (folder / 'AchievementLabs.exe').read_bytes()
          assert hashlib.sha256(exe).hexdigest() == expected, 'Executable checksum mismatch'
          metadata = json.loads((folder / 'update.json').read_text(encoding='utf-8-sig'))
          assert metadata['version'] == '1.0.8.1' and metadata['bytes'] == len(exe) and metadata['sha256'].lower() == expected, 'Update metadata mismatch'
          PY
          printf '\nRelease source: %s\nTested build source: %s (identical source tree)\n' "$SOURCE_SHA" "$BUILD_SHA" >> release-download/BUILD-INFO.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'Achievement Labs 1.0.8 — Combined Upgrade (fork.1)' --notes-file docs/releases/v1.0.8-fork.1.md --draft
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release-download/AchievementLabs.exe release-download/SHA256.txt release-download/BUILD-INFO.txt release-download/update.json --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
