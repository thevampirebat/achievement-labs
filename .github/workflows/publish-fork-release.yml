name: Publish fork release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-fork-release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-v1.0.6-fork.3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.6-fork.3
      SOURCE_SHA: 8f426ca57f7f47b9b44f561c489c3ec5aca3cb22
      BUILD_SHA: d2b9637337005608778ec42ce5d0391aa445edc2
      BUILD_RUN: '38619092297'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested source
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq .head_sha)" = "$BUILD_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$(git rev-parse "$BUILD_SHA^{tree}")"
      - uses: actions/download-artifact@v4
        with:
          name: AchievementLabs-Windows-x64
          path: release-download
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Verify download and publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          folder = Path('release-download')
          expected = (folder / 'SHA256.txt').read_text(encoding='utf-8-sig').split()[0].lower()
          exe = (folder / 'AchievementLabs.exe').read_bytes()
          assert hashlib.sha256(exe).hexdigest() == expected, 'Executable checksum mismatch'
          metadata = json.loads((folder / 'update.json').read_text(encoding='utf-8-sig'))
          assert expected == 'c44bf046b0ea6ac00a295b51f6f01019d775df8a27be9cb6ea4d4183bebcb7d8', 'Wrong tested executable'
          assert metadata['version'] in ('1.0.6.2', '1.0.6.3') and metadata['bytes'] == len(exe) and metadata['sha256'].lower() == expected, 'Update metadata mismatch'
          # The tested executable's PE version is 1.0.6.3. Correct stale packaging metadata without rebuilding it.
          metadata['version'] = '1.0.6.3'
          (folder / 'update.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          info = (folder / 'BUILD-INFO.txt').read_text(encoding='utf-8-sig').replace('Version: 1.0.6.2 source plus fork enhancements', 'Version: 1.0.6.3')
          (folder / 'BUILD-INFO.txt').write_text(info, encoding='utf-8')
          PY
          printf '\nRelease source: %s\nTested build source: %s (identical source tree)\n' "$SOURCE_SHA" "$BUILD_SHA" >> release-download/BUILD-INFO.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'Achievement Labs 1.0.6 — Catalogue and Desktop Improvements (fork.3)' --notes-file docs/releases/v1.0.6-fork.3.md --draft
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release-download/AchievementLabs.exe release-download/SHA256.txt release-download/BUILD-INFO.txt release-download/update.json --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
