name: Publish fork release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-fork-release.yml]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: publish-v1.0.8-fork.11
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.8-fork.11
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the tested Windows build of this commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/windows-build.yml/runs?head_sha=$SOURCE_SHA&event=push&per_page=10" --jq '.workflow_runs[0].id // empty')
            if [ -n "$run" ]; then
              state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)
              if [ "$state" = completed ]; then
                test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
                test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" = "$SOURCE_SHA"
                gh run download "$run" --repo "$GITHUB_REPOSITORY" --name AchievementLabs-Windows-x64 --dir downloads/windows
                exit 0
              fi
            fi
            sleep 30
          done
          echo 'Timed out waiting for a successful Windows build.' >&2
          exit 1
      - name: Retain unchanged mobile downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads/mobile
          gh release download v1.0.8-fork.10 --repo "$GITHUB_REPOSITORY" --dir downloads/mobile \
            --pattern 'AchievementLabs-Android-0.6.1.apk' --pattern 'AchievementLabs-Android-0.6.1.zip' \
            --pattern 'AchievementLabs-iOS-0.12.3-UNSIGNED.ipa' --pattern 'AchievementLabs-iOS-0.12.3.zip' --pattern SHA256.txt
      - name: Verify and package release assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, zipfile, os
          windows = Path('downloads/windows')
          mobile = Path('downloads/mobile')
          out = Path('release-assets')
          out.mkdir()
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          exe = windows / 'AchievementLabs.exe'
          metadata = json.loads((windows / 'update.json').read_text(encoding='utf-8-sig'))
          assert metadata['version'] == '1.0.8.11'
          assert metadata['bytes'] == exe.stat().st_size
          assert metadata['sha256'].lower() == digest(exe)
          build_info = (windows / 'BUILD-INFO.txt').read_text(encoding='utf-8-sig')
          assert 'Commit: ' + os.environ['SOURCE_SHA'] in build_info
          assert 'packaged layout/scroll checks: passed' in build_info
          expected = {}
          for line in (mobile / 'SHA256.txt').read_text(encoding='utf-8-sig').splitlines():
              if line.strip():
                  sha, name = line.split(maxsplit=1)
                  expected[name.lstrip('*')] = sha.lower()
          for path in mobile.iterdir():
              if path.name != 'SHA256.txt':
                  assert expected.get(path.name) == digest(path), 'Mobile checksum mismatch: ' + path.name
                  shutil.copy2(path, out / path.name)
          shutil.copy2(exe, out / exe.name)
          shutil.copy2(windows / 'update.json', out / 'update.json')
          shutil.copy2('docs/releases/START-HERE.md', out / 'START-HERE.md')
          shutil.copy2('docs/releases/v1.0.8-fork.11.md', out / 'RELEASE-NOTES.md')
          shutil.copy2('docs/game-session-and-appearance.md', out / 'GAME-SESSION.md')
          (out / 'BUILD-INFO.txt').write_text(build_info + '\nMobile assets retained unchanged from v1.0.8-fork.10.\n')
          with zipfile.ZipFile(out / 'AchievementLabs-Windows-1.0.8.11.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name in ('AchievementLabs.exe', 'update.json', 'START-HERE.md', 'RELEASE-NOTES.md', 'GAME-SESSION.md', 'BUILD-INFO.txt'):
                  z.write(out / name, name)
          (out / 'SHA256.txt').write_text(''.join(digest(p) + '  ' + p.name + '\n' for p in sorted(out.iterdir()) if p.is_file() and p.name != 'SHA256.txt'))
          print('Verified assets:', ', '.join(p.name for p in out.iterdir()))
          PY
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'Achievement Labs Beta — PC 1.0.8.11 / Android 0.6.1 / iOS 0.12.3' --notes-file docs/releases/v1.0.8-fork.11.md --draft
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
