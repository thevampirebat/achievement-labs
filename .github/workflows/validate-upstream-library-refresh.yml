name: Validate upstream library refresh contribution
on:
  push:
    branches: [validation/upstream-library-refresh]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Check out unchanged upstream baseline
        uses: actions/checkout@v4
        with:
          ref: 1a76574db3ca4d5ee02f162a63cf0ce3123b3db9
          path: baseline
          persist-credentials: false
      - name: Verify public upstream signing dependency is missing
        run: |
          $output = dotnet build baseline/src/AchievementLabs.Core -c Release -p:NuGetAudit=false 2>&1
          $exit = $LASTEXITCODE
          $output | Write-Output
          if ($exit -eq 0 -or ($output -join "`n") -notmatch "CS0103.*Xbox360ConSigningMaterial") { throw "Expected baseline missing-dependency failure was not reproduced." }
          exit 0
      - name: Supply fail-closed compile-only dependency for offline checks
        run: |
          @'
          namespace AchievementLabs.Services.Xbox360;
          internal static class Xbox360ConSigningMaterial
          {
              private static byte[] Missing() => throw new System.NotSupportedException("Compile-only test dependency; signing is unavailable.");
              public static byte[] Certificate => Missing();
              public static byte[] PrimeP => Missing();
              public static byte[] PrimeQ => Missing();
          }
          '@ | Set-Content src/AchievementLabs.Core/Xbox360ConSigningMaterial.ValidationOnly.cs
      - name: Build contribution with compile-only signing dependency
        run: dotnet build tests/AchievementLabs.Enhancements.Tests -c Release -p:NuGetAudit=false
      - name: Check streamed library progress
        run: dotnet run --no-build --project tests/AchievementLabs.Enhancements.Tests -c Release -- --library-refresh
      - name: Check native window bindings
        run: dotnet run --no-build --project tests/AchievementLabs.Enhancements.Tests -c Release -- --integration
