name: AchievementLabsMobile
options:
  bundleIdPrefix: org.achievementlabs
  deploymentTarget:
    iOS: "17.0"
packages:
  LabsMobileCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  AchievementLabsMobile:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Catalogue
        type: folder
        buildPhase: resources
    dependencies:
      - package: LabsMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.achievementlabs.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Achievement Labs
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
schemes:
  AchievementLabsMobile:
    build:
      targets:
        AchievementLabsMobile: all
